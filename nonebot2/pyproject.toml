[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qqbot"
version = "0.1.0"
description = "NoneBot2 + OneBot V11 + NapCat skeleton for mirai migration"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "nonebot2[fastapi]>=2.5.0,<2.6.0",
    "nonebot-adapter-onebot>=2.4.6,<2.5.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "pillow>=10.4.0,<12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Failing to pass a value to the 'type_params' parameter of 'typing.ForwardRef._evaluate'.*:DeprecationWarning:nonebot.typing",
    "ignore:ForwardRef._evaluate is a private API and is retained for compatibility.*:DeprecationWarning:nonebot.typing",
]
